; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Un único proyecto con dos firmwares (uno por placa). Cada entorno compila
; solo su carpeta de src/. La carpeta src/common (protocol.h) la incluyen los
; dos con #include "../common/protocol.h".
;
;   Supervisor: pio run -e supervisor -t upload --upload-port <puerto>
;   Sensor:     pio run -e sensor     -t upload --upload-port <puerto>

[platformio]
; El sensor aún no tiene código: cuando lo tenga, usar "supervisor, sensor"
default_envs = supervisor

[env]
platform = atmelsam
board = mkrwan1310
framework = arduino

[env:supervisor]
build_src_filter = -<*> +<supervisor/>

[env:sensor]
build_src_filter = -<*> +<sensor/>

